services:
  mysql:
    image: mysql:8.0
    container_name: smart_timetable_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_timetable_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - timetable_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_timetable_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_timetable_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - timetable_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_timetable_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - timetable_net

volumes:
  mysql_data:
    driver: local

networks:
  timetable_net:
    driver: bridge
